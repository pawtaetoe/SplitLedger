<style>
  :root { --ink: #17302b; --teal: #0d7366; --pale: #f3f7f4; --line: #dcefe6; --warn: #c44536; --muted: #5b6c68; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--pale); color: var(--ink); font: 18px/1.45 "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.4rem; margin: 8px 0 2px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .who { color: var(--muted); font-size: 0.95rem; margin: 4px 0 8px; }
  button, input { font: inherit; }
  button { min-height: 48px; padding: 8px 16px; border-radius: 10px; border: 2px solid var(--teal); background: #fff; color: var(--teal); font-weight: 600; cursor: pointer; }
  button.on { background: var(--teal); color: #fff; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  input[type=text] { width: 100%; min-height: 48px; padding: 8px 12px; border: 2px solid var(--line); border-radius: 10px; margin: 8px 0; }
  .total { position: sticky; bottom: 0; background: var(--ink); color: #fff; border-radius: 12px; padding: 14px 16px; margin-top: 16px; }
  .total strong { font-size: 1.4rem; }
  .error { background: #fbe9e7; color: var(--warn); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
  .note { color: var(--muted); font-size: 0.9rem; }
  form { margin: 0; }
  h2 { font-size: 1.1rem; margin: 20px 0 8px; }
  .summary { display: flex; gap: 8px; margin: 12px 0; }
  .summary div { flex: 1; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .summary span { display: block; color: var(--muted); font-size: 0.85rem; }
  .summary strong { font-size: 1.1rem; }
  .card { background: #fff; border: 2px solid var(--teal); border-radius: 12px; padding: 12px 16px; margin: 12px 0; }
  .card h2 { margin-top: 4px; }
  li.row { align-items: center; }
  .summary strong, .row > :last-child { white-space: nowrap; }
  html { background: var(--pale); }
  label.tick { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
  label.tick input { width: 28px; height: 28px; margin: 2px 0 0; accent-color: var(--teal); flex: none; }
  .grow { flex: 1; display: block; }
  .grow .row { display: flex; }
  .grow .who { display: block; margin: 4px 0 0; }
  details summary { cursor: pointer; list-style: none; }
  details summary::-webkit-details-marker { display: none; }
  details summary .row { display: flex; font-weight: 600; }
  details summary .row > :first-child::before { content: "+ "; color: var(--teal); }
  details[open] summary .row > :first-child::before { content: "- "; }
  details summary .who { display: block; margin: 4px 0 0; }
  .unit { border-top: 1px solid var(--line); padding: 10px 0 0; margin-top: 10px; }
  li.picked { border-color: var(--teal); box-shadow: inset 4px 0 0 var(--teal); }
  h3 { font-size: 1rem; margin: 16px 0 8px; }
  a.button { display: inline-flex; align-items: center; min-height: 48px; padding: 8px 16px; border-radius: 10px; border: 2px solid var(--teal); color: var(--teal); font-weight: 600; text-decoration: none; margin-top: 4px; }
  .bar { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; margin: 8px 0 0; }
  .bar span { display: block; height: 100%; background: var(--teal); }
  .bar span.over { background: var(--warn); }
  section { margin-bottom: 8px; }
  fieldset { border: 0; padding: 0; margin: 16px 0; }
  legend { font-weight: 700; font-size: 1.1rem; margin-bottom: 8px; }
  label.choice { display: flex; gap: 12px; align-items: flex-start; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 8px; cursor: pointer; }
  label.choice:has(input:checked) { border: 2px solid var(--teal); }
  label.choice input, label.pill input { width: 24px; height: 24px; margin: 2px 0 0; accent-color: var(--teal); flex: none; }
  label.choice .who { display: block; }
  .inline { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 8px; }
  label.pill { display: inline-flex; gap: 8px; align-items: center; min-height: 48px; padding: 6px 14px; background: #fff; border: 1px solid var(--line); border-radius: 24px; cursor: pointer; }
  label.pill:has(input:checked) { border: 2px solid var(--teal); }
  textarea { width: 100%; font: inherit; padding: 8px 12px; border: 2px solid var(--line); border-radius: 10px; margin: 6px 0 8px; }
  .hero { margin-bottom: 8px; }
  .hero .sub strong { color: var(--ink); }
  .tabs { position: sticky; top: 0; z-index: 2; display: flex; gap: 4px; background: var(--pale); padding: 8px 0; margin: 0 0 4px; overflow-x: auto; }
  .tabs a { flex: 1; text-align: center; white-space: nowrap; padding: 10px 8px; min-height: 44px; border-radius: 10px; color: var(--muted); text-decoration: none; font-weight: 600; font-size: 0.95rem; }
  .tabs a[aria-current="page"] { background: var(--ink); color: #fff; }
  .tabs .count { display: inline-block; min-width: 20px; padding: 0 6px; border-radius: 10px; background: var(--teal); color: #fff; font-size: 0.8rem; }
  ul.card, details.card { list-style: none; padding: 0; margin: 0 0 8px; background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  ul.card > li { border: 0; border-radius: 0; margin: 0; padding: 0; background: none; }
  .card .item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); color: inherit; text-decoration: none; }
  .card > li:first-child .item, .card > li.item:first-child, .card > summary.item { border-top: 0; }
  .card .item.stack { flex-direction: column; align-items: stretch; gap: 4px; }
  .card .line { display: flex; justify-content: space-between; gap: 12px; }
  .card .title { font-weight: 600; display: block; }
  .card .who { display: block; color: var(--muted); font-size: 0.9rem; margin: 0; }
  .card .amount { font-weight: 700; white-space: nowrap; text-align: right; }
  .card .amount .who { font-weight: 400; font-size: 0.8rem; }
  .pos { color: var(--teal); }
  .neg { color: var(--warn); }
  .card .date { flex: none; width: 52px; color: var(--muted); font-size: 0.85rem; font-weight: 600; }
  .chev { color: var(--muted); font-size: 1.4rem; line-height: 1; }
  details.fold[open] .chev { transform: rotate(90deg); }
  details.fold summary { cursor: pointer; list-style: none; }
  details.fold summary::-webkit-details-marker { display: none; }
  .bar.thin { height: 6px; margin: 0; }
  a.more { display: inline-block; padding: 6px 0 12px; color: var(--teal); font-weight: 600; text-decoration: none; }
  a.back { display: inline-flex; align-items: center; min-height: 44px; color: var(--teal); font-weight: 600; text-decoration: none; }
  .total { display: flex; align-items: center; gap: 12px; }
  .total .status { flex: none; font-size: 0.9rem; opacity: 0.9; }
  .htmx-indicator { display: none; }
  .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { display: inline; }
  .htmx-request ~ .done, .status:has(.htmx-request) .done { display: none; }
  .saved { background: #e6f4ef; color: var(--ink); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
  a.button.on { background: var(--teal); color: #fff; }
  .amount.muted { color: var(--muted); }
  details.mix summary { cursor: pointer; list-style: none; }
  details.mix summary::-webkit-details-marker { display: none; }
  details.mix[open] .chev { display: inline-block; transform: rotate(90deg); }
  details.mix .line.who { display: flex; padding: 4px 0 0; }
</style>
