# render blueprint, one always on web service and one postgres database
services:
  - type: web
    name: splitledger
    runtime: docker
    # starter stays awake, the free plan sleeps and would miss whatsapp messages
    plan: starter
    healthCheckPath: /healthz
    autoDeploy: true
    region: singapore 
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: splitledger-db
          property: connectionString
      - key: ENV
        value: prod
      - key: LOCALE
        value: global
      - key: WHATSAPP_PROVIDER
        value: twilio
      - key: APP_SECRET
        generateValue: true
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: META_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: EXCHANGE_RATE_API_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false

databases:
  - name: splitledger-db
    plan: free
    region: singapore 
